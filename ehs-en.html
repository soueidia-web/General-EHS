/* Layout: single centred column, one step on screen at a time, safety-sign green as the only accent */
:root{
  --bg:#f2f6f5; --surface:#ffffff; --fg:#14211b; --muted:#56665e; --line:#d5dfd9;
  --accent:#00877b; --accent-fg:#ffffff; --accent-soft:#dff3f0; --plate:#ffffff;
  --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#8a5a00; --warn-soft:#fff3d6;
  --display:"Archivo","Arial Narrow",Arial,sans-serif;
  --body:"Source Sans 3","Segoe UI",Roboto,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1613; --surface:#17211c; --fg:#e6efe9; --muted:#9fb1a7; --line:#2b3a32;
  --accent:#3cc9b8; --accent-fg:#04201c; --accent-soft:#123430;
  --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c35b; --warn-soft:#33290f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#17211c; --fg:#e6efe9; --muted:#9fb1a7; --line:#2b3a32;
  --accent:#3cc9b8; --accent-fg:#04201c; --accent-soft:#123430;
  --bad:#ff8a80; --bad-soft:#3a1a18; --warn:#f2c35b; --warn-soft:#33290f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:17px/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
img.emblem{width:44px;height:44px;flex:none;display:block}
.logo-card{background:var(--plate);border:1px solid var(--line);border-radius:10px;padding-block:22px;padding-inline:16px;display:flex;justify-content:center}
.logo-card img{width:100%;max-width:260px;height:auto;display:block}
header.brand{display:flex;align-items:center;gap:12px}
.sign{width:44px;height:44px;flex:none;background:var(--accent);border-radius:6px;position:relative}
.sign::before,.sign::after{content:"";position:absolute;background:var(--accent-fg);left:50%;top:50%;transform:translate(-50%,-50%)}
.sign::before{width:26px;height:8px}.sign::after{width:8px;height:26px}
.brand h1{font:800 1.25rem/1.15 var(--display);margin:0;letter-spacing:.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:14px}
h2{font:800 1.5rem/1.2 var(--display);margin:0;text-wrap:balance}
h3{font:600 1.05rem/1.3 var(--display);margin:0}
p{margin:0}
.eyebrow{font:600 .75rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}
ul.pts{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.key{background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-weight:600}
.caution{background:var(--warn-soft);color:var(--fg);border-radius:8px;padding:12px 14px}
.caution b{color:var(--warn)}
label{font-weight:600;font-size:.95rem;display:flex;flex-direction:column;gap:6px}
input[type=text]{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:space-between}
button{font:600 1rem var(--body);border-radius:8px;padding:12px 18px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
button:disabled{opacity:.45;cursor:not-allowed}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.meta{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;font-weight:400;display:flex;gap:12px;align-items:flex-start;padding:12px 14px}
.opt .l{font:600 .85rem var(--mono);color:var(--muted);flex:none;padding-top:2px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{color:var(--accent)}
.score{font:800 3.2rem/1 var(--display);font-variant-numeric:tabular-nums}
.pill{display:inline-block;font:700 .8rem var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
.pill.pass{background:var(--accent-soft);color:var(--accent)}
.pill.fail{background:var(--bad-soft);color:var(--bad)}
.record{border:2px solid var(--accent);border-radius:10px;padding:18px;display:grid;grid-template-columns:auto 1fr;gap:8px 16px}
.record dt{color:var(--muted);font-size:.9rem}
.record dd{margin:0;font-weight:600;min-width:0;overflow-wrap:anywhere}
.code{font:500 1.35rem var(--mono);letter-spacing:.06em;color:var(--accent)}
.review{display:flex;flex-direction:column;gap:10px}
.review div{border-left:3px solid var(--bad);padding:4px 0 4px 12px}
.ok{color:var(--accent);font-weight:700}.no{color:var(--bad);font-weight:700}
footer{font-size:.85rem;color:var(--muted);text-align:center}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.bar>i{transition:none}}
:root{--ink:#26403a;--ink2:#8aa39c;--ill-bg:#e6f1ee;--blood:#c62828;--sun:#f2b705;--water:#2f86d0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#d3e4df;--ink2:#6f8a83;--ill-bg:#1a2925;--blood:#ef5350;--sun:#f5c542;--water:#6fb3f0}}
:root[data-theme="dark"]{--ink:#d3e4df;--ink2:#6f8a83;--ill-bg:#1a2925;--blood:#ef5350;--sun:#f5c542;--water:#6fb3f0}
.ill{background:var(--ill-bg);border-radius:10px;padding:8px;display:flex;justify-content:center}
.ill svg{width:100%;max-width:440px;height:auto;display:block;direction:ltr}
svg .ln{stroke:var(--ink);stroke-width:11;stroke-linecap:round;stroke-linejoin:round;fill:none}
svg .cs{stroke:var(--ink2)} svg .thin{stroke-width:4}
svg .hd{fill:var(--ink)} svg .hd2{fill:var(--ink2)} svg .ac{fill:var(--accent)} svg .acs{stroke:var(--accent)}
svg .af{fill:var(--accent-fg)} svg .rd{fill:var(--blood)} svg .yl{fill:var(--sun)} svg .bl{fill:var(--water)}
svg .pl{fill:var(--plate);stroke:var(--line);stroke-width:2} svg .gd{stroke:var(--line);stroke-width:3}
svg .ray{stroke:var(--sun);stroke-width:5;stroke-linecap:round}
svg .st{fill:var(--ill-bg);font:700 13px var(--body)} svg .sti{fill:var(--ink);font:700 15px var(--body)}
.push{transition:none}
@keyframes press{50%{transform:translateY(8px)}}
.loop .push{animation:press .545s ease-in-out infinite}
.push.go{animation:press .22s ease-out}
.presser{transition:transform .15s}.presser.down{transform:translateY(6px)}
.stain{transform-box:fill-box;transform-origin:center}
@keyframes drop{0%{transform:translateY(0);opacity:1}100%{transform:translateY(46px);opacity:0}}
.drop{animation:drop 1.05s linear infinite}.d2{animation-delay:.35s}.d3{animation-delay:.7s}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{transform-origin:70px 52px;animation:spin 24s linear infinite}
@keyframes rise{from{transform:scaleY(.45)}to{transform:scaleY(1)}}
.merc{transform-box:fill-box;transform-origin:bottom;animation:rise 2.6s ease-in-out infinite alternate}
@keyframes draw{from{stroke-dashoffset:34}to{stroke-dashoffset:0}}
.tick{stroke-dasharray:34;animation:draw .5s ease-out both}.t1{animation-delay:.4s}.t2{animation-delay:.8s}.t3{animation-delay:1.2s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.shake{animation:shake .3s}
.act{border:2px dashed var(--accent);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px}
.act-h{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.act-state{font-size:.85rem;font-weight:700;color:var(--muted)}.act-state.ok{color:var(--accent)}
.act-msg{min-height:1.5em;font-weight:600;margin:0}.act-msg.good{color:var(--accent)}.act-msg.bad{color:var(--bad)}
.act-body{display:flex;flex-direction:column;gap:12px}
.slots{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.slots li{border:1px dashed var(--line);border-radius:8px;padding:10px;min-height:48px;display:flex;gap:10px;align-items:center;font-weight:600}
.slots li span{font:600 .8rem var(--mono);color:var(--muted)}
.slots li.fill{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.gwrap{display:flex;flex-direction:column;gap:4px}
.gauge{position:relative;height:14px;border-radius:7px;background:var(--line);margin-inline:6px}
.gauge .zone{position:absolute;top:0;bottom:0;left:40%;width:20%;background:var(--accent);opacity:.45;border-radius:7px}
.gauge i{position:absolute;top:-5px;width:4px;height:24px;margin-left:-2px;background:var(--fg);border-radius:2px;left:0;transition:left .2s}
.gl{position:relative;height:1.3em;font-size:.78rem;color:var(--muted);margin-inline:6px;font-variant-numeric:tabular-nums}
.gl span{position:absolute;transform:translateX(-50%)}
.gl span:first-child{transform:none}.gl span:last-child{transform:translateX(-100%)}

.beat{width:14px;height:14px;border-radius:50%;background:var(--line)}
@keyframes beat{from{background:var(--accent);transform:scale(1.4)}to{background:var(--line);transform:scale(1)}}
.beat.on{animation:beat .3s ease-out}
.sortcard{border:1px solid var(--line);border-radius:8px;padding:16px;font-weight:600;font-size:1.08rem;text-align:center;background:var(--bg)}
.sortcard.sc{text-align:start;font-weight:400}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{padding:14px 8px}
.opt.sel:disabled{opacity:1}
.lockhint{font-size:.9rem;color:var(--muted);margin:0}
.passmark{width:64px;height:64px}
.passmark path{stroke:var(--accent-fg);stroke-width:5;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;animation:draw2 .6s .2s ease-out both}
@keyframes draw2{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}

:root{--lowc:#2e9d5b;--medc:#e0b100;--highc:#ea7a1a;--vhighc:#c62828}

.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.82rem;color:var(--muted)}

.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.task{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-weight:600}
input[type=range]{width:100%;accent-color:var(--accent)}
.lad-read{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;font-weight:600;gap:8px;flex-wrap:wrap}
svg .wall{fill:var(--ink2)} svg .rail{stroke:var(--accent);stroke-width:5;stroke-linecap:round} svg .rung{stroke:var(--accent);stroke-width:3}

function hashCode(str){let h1=0x811c9dc5,h2=0x1b873593;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,16777619);h2=Math.imul(h2^c,2246822519)}

function media(L){

}

function submit(){

function renderVerify(){
 app.innerHTML=`<section class="panel">
  <span class="eyebrow">${U.trainerOnly}</span>
  <h2>${U.verifyTitle}</h2>
  <p class="muted">${U.verifyIntro}</p>
  <form id="vf" style="display:flex;flex-direction:column;gap:14px">
   <label for="vn">${U.fullName}<input id="vn" type="text" required></label>
   <label for="vi">${U.dId}<input id="vi" type="text" dir="auto" required></label>
   <label for="vs">${U.vScore}<input id="vs" type="text" inputmode="numeric" dir="ltr" required></label>
   <label for="vd">${U.vDate}<input id="vd" type="text" dir="ltr" placeholder="2026-10-21" required></label>
   <label for="vc">${U.dCode}<input id="vc" type="text" dir="ltr" placeholder="XXXX-XXXX" required></label>
   <div class="row end"><button type="button" id="back">${U.backCourse}</button><button class="primary" type="submit">${U.check}</button></div>
  </form>
  <div id="vr" aria-live="polite"></div></section>`;
 document.getElementById("back").onclick=()=>{history.replaceState(null,"",location.pathname+location.search);render()};
 document.getElementById("vf").addEventListener("submit",e=>{e.preventDefault();
  const g=id=>document.getElementById(id).value.trim();
  const sc=parseInt(g("vs"),10),exp=makeCode(g("vn"),g("vi"),sc,g("vd")),got=g("vc").toUpperCase().replace(/\s/g,"");
  const ok=exp===got&&sc>=PASS*100;
  document.getElementById("vr").innerHTML=ok?`<div class="key"><span class="ok">${U.valid}</span> ${U.validText}</div>`:`<div class="caution"><b>${U.invalid}</b> ${U.invalidText}</div>`;
 });
}

/* ---------- activities ---------- */
function mountActivity(i,box){
 const A=ACTS[i];if(!A||!box)return;
 box.innerHTML=`<div class="act"><div class="act-h"><span class="eyebrow">${U.activity}</span><span class="act-state ${DONE.has(i)?"ok":""}">${DONE.has(i)?U.complete:U.required}</span></div><p>${A.prompt}</p><div class="act-body"></div><p class="act-msg" aria-live="polite"></p></div>`;
 const body=box.querySelector(".act-body"),msg=box.querySelector(".act-msg"),st=box.querySelector(".act-state");
 const say=(t,c)=>{msg.textContent=t;msg.className="act-msg "+(c||"")};
 const fin=t=>{DONE.add(i);say(t,"good");st.textContent=U.complete;st.classList.add("ok");unlock()};
 ({order:actOrder,sort:actSort,scenario:actScenario,matrix:actMatrix,ladder:actLadder})[A.type](A,body,say,fin);
}
function actOrder(A,body,say,fin){
 let pos=0;const items=shuffle(A.items.map((t,i)=>({t,i})));
 body.innerHTML=`<ol class="slots">${A.items.map((_,i)=>`<li><span>${i+1}</span><b></b></li>`).join("")}</ol><div class="tiles">${items.map(x=>`<button type="button" class="tile" data-i="${x.i}">${x.t}</button>`).join("")}</div>`;
 const slots=body.querySelectorAll(".slots li");
 body.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
  if(+b.dataset.i===pos){slots[pos].querySelector("b").textContent=b.textContent;slots[pos].classList.add("fill");b.hidden=true;pos++;
   if(pos===A.items.length)fin(A.done);else say(U.correct,"good")}
  else{shakeEl(b);say(A.wrong||U.wrongOrder,"bad")}});
}
function actSort(A,body,say,fin){
 let q=shuffle(A.items.map((_,i)=>i)),okc=0;const total=A.items.length;
 const draw=()=>{
  if(!q.length){body.innerHTML=`<div class="sortcard">${total} / ${total} ✓</div>`;fin(A.done);return}
  const it=A.items[q[0]];
  body.innerHTML=`<div class="meta"><span>${okc} / ${total}</span></div><div class="sortcard">${it[2]?`<img class="sortimg" src="img/${it[2]}" alt="">`:""}${it[0]}</div><div class="${A.labels.length>2?"multi":"two"}">${A.labels.map((l,j)=>`<button type="button" class="sbtn" data-j="${j}">${l}</button>`).join("")}</div>`;
  body.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{
   if(+b.dataset.j===it[1]){okc++;q.shift();say(U.correct+" "+(it[3]||(it[0]+": "+A.labels[it[1]])),"good")}
   else{q.push(q.shift());say(fmt(U.wrongThis,{a:A.labels[it[1]]}),"bad")}
   draw()});
 };
 draw();
}
function actScenario(A,body,say,fin){
 let k=0;
 const draw=()=>{const s=A.items[k];
  body.innerHTML=`<div class="meta"><span>${k+1} / ${A.items.length}</span></div><div class="sortcard sc">${s.img?`<img class="sortimg" src="img/${s.img}" alt="">`:""}${s.s}</div><div class="opts">${s.o.map((o,j)=>`<button type="button" class="opt" data-j="${j}"><span>${o}</span></button>`).join("")}</div>`;
  body.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   if(+b.dataset.j===s.a){b.classList.add("sel");body.querySelectorAll(".opt").forEach(x=>x.disabled=true);
    if(k===A.items.length-1){fin(U.correct+" "+s.w)}
    else{say(U.correct+" "+s.w,"good");const nb=document.createElement("button");nb.className="primary";nb.type="button";nb.textContent=U.nextQ;nb.onclick=()=>{k++;say("");draw()};body.appendChild(nb)}}
   else{shakeEl(b);say(U.notQuite,"bad")}});
 };
 draw();
}
function band(r){return r<=4?1:r<=10?2:r<=16?3:4}
function actMatrix(A,body,say,fin){
 let k=0;
 const grid=()=>{let h=`<div class="mx"><div class="ax"></div>${[1,2,3,4,5].map(l=>`<div class="ax">${l}</div>`).join("")}`;
  for(let s=5;s>=1;s--){h+=`<div class="ax">${s}</div>`;for(let l=1;l<=5;l++){h+=`<button type="button" class="cell b${band(s*l)}" data-s="${s}" data-l="${l}" aria-label="${U.sev} ${s} × ${U.like} ${l}"></button>`}}
  return h+"</div>"};
 const draw=()=>{const t=A.tasks[k];
  body.innerHTML=`<div class="meta"><span>${k+1} / ${A.tasks.length}</span></div><div class="task">${t.h}<br><span class="muted" style="font-weight:400">${fmt(U.mxTask,{s:t.s,l:t.l})}</span></div>
  <div class="mxlab"><span>↓ ${U.sev}</span><span>${U.like} →</span></div>${grid()}
  <div class="legend">${U.bands.map((b,j)=>`<span><i style="background:var(--${["lowc","medc","highc","vhighc"][j]})"></i>${b}</span>`).join("")}</div>`;
  body.querySelectorAll(".cell").forEach(c=>c.onclick=()=>{
   const s=+c.dataset.s,l=+c.dataset.l;
   if(s===t.s&&l===t.l){c.classList.add("hit");c.textContent=s*l;body.querySelectorAll(".cell").forEach(x=>x.disabled=true);
    const m=fmt(U.mxRes,{s,l,r:s*l,b:U.bands[band(s*l)-1]});
    if(k===A.tasks.length-1)fin(m+" "+A.done);
    else{say(m,"good");const nb=document.createElement("button");nb.className="primary";nb.type="button";nb.textContent=U.nextQ;nb.onclick=()=>{k++;say("");draw()};body.appendChild(nb)}}
   else{shakeEl(c);say(fmt(U.mxWrong,{s,l}),"bad")}});
 };
 draw();
}
function actLadder(A,body,say,fin){
 const H=140,X=250,G=180;
 body.innerHTML=`<div class="ill"><svg viewBox="0 0 320 200" role="img"><rect class="wall" x="${X}" y="40" width="40" height="${G-40}"/><line class="gd" x1="10" y1="${G}" x2="310" y2="${G}"/><line class="gd" x1="${X}" y1="40" x2="310" y2="40"/><g id="lad"></g></svg></div>
 <input type="range" id="ladr" min="8" max="120" value="96" dir="ltr" aria-label="${U.ladAria}">
 <div class="lad-read"><span id="ang"></span><span id="rat"></span></div>
 <button class="primary" type="button" id="ladc">${U.ladCheck}</button>`;
 const r=body.querySelector("#ladr"),g=body.querySelector("#lad"),ang=body.querySelector("#ang"),rat=body.querySelector("#rat");
 const ok=d=>{const a=Math.atan(H/d)*180/Math.PI;return a>=73&&a<=78};
 const draw=()=>{const d=+r.value,fx=X-d,a=Math.atan(H/d)*180/Math.PI,len=Math.hypot(d,H),ux=d/len,uy=-H/len,ext=22;
  const tx=X+ux*ext,ty=40+uy*ext,ox=-uy*6,oy=ux*6;let s="";
  s+=`<line class="rail" x1="${fx-ox}" y1="${G-oy}" x2="${tx-ox}" y2="${ty-oy}"/><line class="rail" x1="${fx+ox}" y1="${G+oy}" x2="${tx+ox}" y2="${ty+oy}"/>`;
  for(let t=14;t<len+ext;t+=14){const px=fx+ux*t,py=G+uy*t;s+=`<line class="rung" x1="${px-ox}" y1="${py-oy}" x2="${px+ox}" y2="${py+oy}"/>`}
  s+=`<path class="dim" d="M${fx} ${G+10} H${X}"/><text class="lbl" x="${(fx+X)/2}" y="${G+22}" text-anchor="middle">1</text><text class="lbl" x="${X-10}" y="${(G+40)/2}" text-anchor="end">${(H/d).toFixed(1)}</text>`;
  g.innerHTML=s;ang.textContent=fmt(U.ladAngle,{a:Math.round(a)});rat.textContent=fmt(U.ladRatio,{r:(H/d).toFixed(1)});
  say(ok(d)?U.ladGood:a<73?U.ladShallow:U.ladSteep,ok(d)?"good":"bad")};
 r.addEventListener("input",draw);draw();
 body.querySelector("#ladc").onclick=()=>{if(ok(+r.value))fin(A.done);else{shakeEl(r);say(U.ladNot,"bad")}};
}
window.addEventListener("hashchange",render);
render();

</script>
</body></html>
